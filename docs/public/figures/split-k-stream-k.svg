  <text x="82" y="722" text-anchor="end" class="mono">SM 3</text>
  <rect x="92" y="704" width="72" height="28" fill="#e8dcf5" stroke="#7a4fb0" stroke-width="1.2"/>
  <text x="128.0" y="722" text-anchor="middle" class="mono">t3[6:8]</text>
  <rect x="164" y="704" width="288" height="28" fill="#f8d7d7" stroke="#b04a4a" stroke-width="1.2"/>
  <text x="308.0" y="722" text-anchor="middle" class="mono">t4[0:8]</text>
  <line x1="92" y1="740" x2="668" y2="740" stroke="#d0d7de"/>
