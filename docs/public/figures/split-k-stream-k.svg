  <text x="236.0" y="162" text-anchor="middle" class="mono">tile 1</text>
  <rect x="380" y="144" width="288" height="28" fill="url(#pad)" stroke="#8c959f" stroke-width="1"/>
  <text x="524.0" y="162" text-anchor="middle" class="note">空闲</text>
  <text x="82" y="206" text-anchor="end" class="mono">SM 2</text>
