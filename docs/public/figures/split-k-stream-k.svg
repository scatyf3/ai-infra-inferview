  <line x1="524" y1="330" x2="524" y2="504" stroke="#1f2328" stroke-dasharray="4 3"/>
  <text x="686" y="386" class="big">12 轮 + 合并</text>
  <text x="686" y="408" class="note">效率 40 / 48 = 83%</text>
  <text x="686" y="426" class="note">另起 reduce / atomic / fixup</text>
  <rect x="528" y="336" width="30" height="160" rx="3" fill="#ffffff" stroke="#57606a" stroke-dasharray="3 2"/>
  <text x="543" y="412.0" text-anchor="middle" class="note">合</text>
  <text x="543" y="428.0" text-anchor="middle" class="note">并</text>
  <text x="24" y="556" class="title">(c) Stream-K：5 × 8 = 40 轮排成一队，每个 SM 一个常驻 CTA，各领连续 10 轮，tile 边界不管</text>
  <text x="82" y="590" text-anchor="end" class="mono">SM 0</text>
  <rect x="92" y="572" width="288" height="28" fill="#dce8f5" stroke="#3b6ea5" stroke-width="1.2"/>
  <text x="236.0" y="590" text-anchor="middle" class="mono">t0[0:8]</text>
