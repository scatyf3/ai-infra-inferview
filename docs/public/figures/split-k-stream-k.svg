  <text x="686" y="150" class="big">16 轮</text>
  <text x="686" y="172" class="note">效率 40 / 64 = 62.5%</text>
  <text x="24" y="320" class="title">(b) Split-K，S = 2：10 个半 tile 的 block 排 3 波，仍然对不齐；每个 tile 还要合并 2 份部分和</text>
  <text x="82" y="354" text-anchor="end" class="mono">SM 0</text>
