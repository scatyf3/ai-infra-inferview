  <text x="24" y="780" class="note">箭头：被切开的 tile，后半段在下一行区间的开头，先算完，部分和存进 workspace 并置 flag；</text>
  <text x="24" y="798" class="note">算了第 0 轮的 CTA 到自己区间末尾才碰这个 tile，收齐部分和后写 C，基本不用等。t[a:b] 是这个 tile 的第 a 到 b−1 轮。</text>
</svg>
