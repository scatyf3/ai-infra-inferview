  <line x1="308" y1="504" x2="308" y2="508" stroke="#8c959f"/>
  <text x="308" y="520" text-anchor="middle" class="note">6</text>
  <line x1="380" y1="504" x2="380" y2="508" stroke="#8c959f"/>
  <text x="380" y="520" text-anchor="middle" class="note">8</text>
  <line x1="452" y1="504" x2="452" y2="508" stroke="#8c959f"/>
  <text x="452" y="520" text-anchor="middle" class="note">10</text>
  <line x1="524" y1="504" x2="524" y2="508" stroke="#8c959f"/>
  <text x="524" y="520" text-anchor="middle" class="note">12</text>
  <line x1="596" y1="504" x2="596" y2="508" stroke="#8c959f"/>
