<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 818" width="900" height="818" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1f2328">
  <defs>
    <pattern id="pad" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f3f4f6"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#b6bcc4" stroke-width="2"/>
    </pattern>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8742a"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c8d4f"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4fb0"/></marker>
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; }
      .title { font-size: 15px; font-weight: 600; }
      .big { font-size: 15px; font-weight: 600; }
      .note { font-size: 12px; fill: #57606a; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="817" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="32" class="note">同一个例子：4 个 SM，5 个输出 tile（颜色区分），每个 tile 沿 K 要 8 轮（K / BK = 8）。横轴是时间，一格一轮，虚线是 kernel 结束。</text>
  <text x="24" y="50" class="note">每行是一个 SM。(a)(b) 里每个色块是一个 block（CTA），跑完换下一个；(c) 只启动 4 个 CTA，每个 SM 上一个，从头跑到尾。</text>
  <text x="24" y="84" class="title">(a) data-parallel：一个 tile 一个 block，5 个 tile 排 2 波，第 2 波只有 1 个 SM 有活</text>
  <text x="82" y="118" text-anchor="end" class="mono">SM 0</text>
  <rect x="92" y="100" width="288" height="28" fill="#dce8f5" stroke="#3b6ea5" stroke-width="1.2"/>
  <text x="236.0" y="118" text-anchor="middle" class="mono">tile 0</text>
  <rect x="380" y="100" width="288" height="28" fill="#f8d7d7" stroke="#b04a4a" stroke-width="1.2"/>
  <text x="524.0" y="118" text-anchor="middle" class="mono">tile 4</text>
  <text x="82" y="162" text-anchor="end" class="mono">SM 1</text>
