  <text x="524" y="284" text-anchor="middle" class="note">12</text>
  <line x1="596" y1="268" x2="596" y2="272" stroke="#8c959f"/>
  <text x="596" y="284" text-anchor="middle" class="note">14</text>
  <line x1="668" y1="268" x2="668" y2="272" stroke="#8c959f"/>
  <text x="668" y="284" text-anchor="middle" class="note">16</text>
